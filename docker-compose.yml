# ==============================================================================
# 🏛️ THE MASTERY SUITE: CAPSTONE DISTRIBUTED ARCHITECTURE
# ==============================================================================
# Orquesta en local un ecosistema distribuido completo interconectando los
# componentes de las diferentes especialidades de la suite.
# ==============================================================================

version: '3.8'

services:
  # 1. Capa de Persistencia Relacional (backend-mastery / SQL)
  postgres:
    image: postgres:16-alpine
    container_name: mastery-postgres
    environment:
      POSTGRES_USER: mastery_user
      POSTGRES_PASSWORD: mastery_password
      POSTGRES_DB: mastery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastery_user -d mastery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Capa de Caché & Bloqueo Distribuido (backend-mastery / NoSQL Redis)
  redis:
    image: redis:7-alpine
    container_name: mastery-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  # 3. Microservicio Analítico & Datos en Python (python-ecosystem-mastery / FastAPI)
  python-analytics:
    image: python:3.11-slim
    container_name: mastery-python-worker
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://mastery_user:mastery_password@postgres:5432/mastery_db
      - REDIS_URL=redis://redis:6379/0
    command: >
      sh -c "echo '🐍 Python Ecosystem Analytics Worker listo en puerto 8000' && tail -f /dev/null"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Servicio de Alto Rendimiento en PHP (php-ecosystem-mastery / FrankenPHP / Laravel)
  php-service:
    image: dunglas/frankenphp:latest
    container_name: mastery-php-worker
    working_dir: /app
    environment:
      - SERVER_NAME=:8080
      - DATABASE_URL=postgresql://mastery_user:mastery_password@postgres:5432/mastery_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. API Core en Node.js (nodejs-ecosystem-mastery / NestJS / Express)
  node-core-api:
    image: node:20-alpine
    container_name: mastery-node-api
    working_dir: /app
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://mastery_user:mastery_password@postgres:5432/mastery_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHON_SERVICE_URL=http://python-analytics:8000
    command: >
      sh -c "echo '🟢 Node.js Core API Gateway listo en puerto 3000' && tail -f /dev/null"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 5. Frontend Web Client (frontend-mastery / Next.js 15)
  frontend-client:
    image: node:20-alpine
    container_name: mastery-frontend
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    command: >
      sh -c "echo '⚛️ Frontend Next.js Client listo en puerto 3001' && tail -f /dev/null"
    ports:
      - "3001:3001"
    depends_on:
      - node-core-api

volumes:
  pgdata:
