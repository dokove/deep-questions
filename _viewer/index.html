<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mastery Suite — Visualizador Interactivo de Preguntas de Entrevista</title>
  <meta name="description" content="Visualizador interactivo de 1,150 preguntas técnicas de entrevista para roles Junior, Mid, Senior, Staff y Lead en Node.js, Express, NestJS, TypeScript, Agile, Backend, Cloud, CI/CD, Frontend, PHP y Python.">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sticky Header -->
  <header class="header">
    <div class="header-container">
      <a href="#" class="brand">
        <span class="brand-icon">🏛️</span>
        <div>
          <div class="brand-title">The Mastery Suite</div>
          <div class="brand-subtitle">Interview Questions Visualizer</div>
        </div>
      </a>

      <!-- Global Progress -->
      <div class="header-stats">
        <div class="global-progress">
          <span style="color: var(--text-muted); font-size: 0.8rem; font-weight: 600;">PROGRESO GLOBAL:</span>
          <div class="progress-bar-mini">
            <div class="progress-fill-mini" id="globalProgressFill"></div>
          </div>
          <span id="globalProgressText" style="font-weight: 700; color: #fff;">0 / 1150 Dominadas (0%)</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main App Shell -->
  <main class="app-container">

    <!-- Modules Navigation Bar -->
    <nav class="modules-bar-wrapper" aria-label="Especialidades Técnicas">
      <div class="modules-bar" id="modulesBar">
        <!-- Generado dinámicamente por app.js -->
      </div>
    </nav>

    <!-- Active Module Hero -->
    <section class="hero-card" id="heroCard" aria-live="polite">
      <!-- Generado dinámicamente por app.js -->
    </section>

    <!-- Controls Bar: Search, Filters & Bulk Actions -->
    <section class="controls-bar" aria-label="Filtros y Búsqueda">
      <!-- Search -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="search" 
          id="searchInput" 
          class="search-input" 
          placeholder="Buscar preguntas por palabra clave, código o banderas..." 
          aria-label="Buscar preguntas"
        />
      </div>

      <!-- Seniority Filters -->
      <div class="filter-group">
        <span class="filter-label">Nivel:</span>
        <button class="filter-btn active" data-seniority="ALL">Todos</button>
        <button class="filter-btn" data-seniority="JUNIOR">Junior</button>
        <button class="filter-btn" data-seniority="MID">Mid-Level</button>
        <button class="filter-btn" data-seniority="SENIOR">Senior</button>
        <button class="filter-btn" data-seniority="STAFF">Staff / Lead</button>
      </div>

      <!-- Status Filters -->
      <div class="filter-group">
        <span class="filter-label">Estado:</span>
        <button class="filter-btn active" data-status="ALL">Todas</button>
        <button class="filter-btn" data-status="PENDING">Pendientes</button>
        <button class="filter-btn" data-status="MASTERED">✓ Dominadas</button>
        <button class="filter-btn" data-status="BOOKMARKED">★ Favoritas</button>
      </div>

      <!-- Bulk Actions -->
      <button class="btn-toggle-all" onclick="toggleAllSections()" title="Expandir o colapsar todas las secciones">
        <span>⇕</span>
        <span>Expandir/Colapsar Todo</span>
      </button>
    </section>

    <!-- Sections and Questions Container -->
    <section class="sections-list" id="sectionsContainer" aria-label="Lista de Preguntas por Sección">
      <!-- Secciones generadas dinámicamente -->
    </section>

  </main>

  <!-- Load Compiled Data & Core Logic -->
  <script src="data/questions-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
